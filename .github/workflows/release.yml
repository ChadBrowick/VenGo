# When you publish a release (tag like 4.21), this attaches VenGo-v<tag>.zip (the vengo/ folder)
# and, if you left the description empty, fills it in from release-notes/<tag>.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build the zip
        run: zip -qr "VenGo-v${TAG}.zip" vengo
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Attach the zip and the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          gh release upload "$TAG" "VenGo-v${TAG}.zip" --clobber --repo "$GITHUB_REPOSITORY"
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ] && [ -f "release-notes/${TAG}.md" ]; then
            gh release edit "$TAG" --notes-file "release-notes/${TAG}.md" --repo "$GITHUB_REPOSITORY"
          fi
