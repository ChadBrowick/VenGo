# Posts a release when a version tag (like 4.21) is pushed:
# zips the vengo/ folder as VenGo-v<tag>.zip and uses release-notes/<tag>.md as the notes.
name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        run: zip -qr "VenGo-v${GITHUB_REF_NAME}.zip" vengo

      - name: Notes
        run: |
          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
            cp "release-notes/${GITHUB_REF_NAME}.md" notes.md
          else
            echo "VenGo ${GITHUB_REF_NAME}" > notes.md
          fi

      - name: Post the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "VenGo-v${GITHUB_REF_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
